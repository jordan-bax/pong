paths:
  /search:
    get:
      summary: returns the user that have the given string somewhere in the username
      Parameters:
        header_item: x-internal
        description: header tag needed if going via frontend
        query:
          description: the query string on what to look up for
      Responses:
        200:
          description: return with all the users who have a username with the query string in it
          content:
            application/json:
              schema:
                type: object
                items:
                  users: an array of users who have a username whith the query string in it or empty array
        401:
          description: on user is logged in
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
        400:
          description: query string missing
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
  /friends:
    get:
      summary: Retrieves the friends list of the logged in user;
      Parameters:
        header_item: x-internal
        description: header tag needed if going via frontend
      Responses:
        200:
          description: user has friends
          content:
            string:
              type: string
              items:
                string: string with emails of friends as string like "email,email2,email3,..."
        401:
          description: no user is logged in
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
        404:
          description: user has no friends
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
  /pending:
    get:
      summary: Retrieves the users incoming friend requests
      Parameters:
        header_item: x-internal
        description: header tag needed if going via frontend
      Responses:
        200:
          description: the user has incoming friend requests
          content:
            string:
              type: string
              items:
                string: the string with emails of incoming friend requests like "email,email2,email3,..."
        401:
          description: no user is logged in
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
        404:
          description: user has no pending friend requests
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
  /requested:
    get:
      summary: get the users current outgoing friend requests
      Parameters:
        header_item: x-internal
        description: header tag needed if going via frontend
      Responses:
        200:
          description: the user has outgoing friend requests
          content:
            string:
              schema:
                type: string
                items:
                  string: string with all the outgoind friend requests
        401:
          description: no user is logged in
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
        404:
          description: no outgoing friend requests
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
    post:
      summary: set friend request
      Parameters: 
        header_item: x-internal
        description: header tag needed if going via frontend
        body:
          description: info of the user to add
          content:
            string:
              schema:
                type: string
                items: 
                  email: email of user
      Responses:
        200:
          description: user has been send a friend request
          content:
            application/json:
              schema:
                type: object
                items:
                  success: boolean
        400:
          description: perameter not given
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
        401:
          description: qurrent request has no logged in user
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
        500:
          description: server error with database
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
  /me:
    get:
      summary: Retrieves data if the current user is logged in and known server side
      Parameters:
        header_item: x-internal
        description: header tag needed if going via frontend
      Responses:
        200:
          description: user is logged in and known server side
          content:
            application/json:
              schema:
                type: object
                items:
                  isLoggedin: boolean 
                  user: string of user email
        404:
          description: no user is logged in
          content:
            application/json:
              schema:
                type: object
                items:
                  isLoggedin: boolean
  /me/data:
    get:
      summary: Retrieves all data about the current logged in user 
      Parameters:
        header_item: x-internal
        description: header tag needed if going via frontend
        query:
          description: extra info to get everything from the current user
          content:
            RequestCredentials:
              schema:
                type: RequestCredentials
                items:
                  credentials: RequestCredentials
      Responses:
        200:
          description: All data of the logged in user
          content:
            application/json:
              schema:
                type: object
                items:
                  user: object of table row form the database
        401:
          description: No user is logged in
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
        404:
          description: User is logged in but unknown in database
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
        500:
          description: Server error
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
  /csrf-token:
    get:
      summary: gives the server csrf token
      Parameters:
        header_item: x-internal
        description: header tag needed if going via frontend
      Responses:
        200:
          description: the string holding the csrf token
          content:
            application/json:
              schema:
                type: object
                items:
                  csrfToken: string of csrf token
  /profile-picture:
    get:
      summary: gets the profile picture of the user
      Parameters:
        header_item: x-internal
        description: header tag needed if going via frontend
      Responses:
      200:
        description: gives a stream to the user profile picture
        content:
          fs.ReadStream:
            schema:
              type: fs.ReadStream
              items:
      404:
        description: file not found
        content:
          application/json:
            schema:
              type: object
              items:
                error: string with error message
      500:
        description: Server error
        content:
          application/json:
            schema:
              type: object
              items:
                error: string with error message
  /register:
    post:
      summary: registers a user and make it known by the server 
      Parameters:
        header_item: x-internal
        description: header tag needed if going via frontend
        body:
          description: the data should come from the form itself
          content:
            multipart/form-data:
              schema:
                type: multipart/form-data
                items:
                  _csrf: string with csrfToken
                  username: string with username
                  password: sting with password
                  email: string with email
                  profilePicture: file of profilePicture (optional)
      Responses:
        200:
          description: user registration success
          content:
            application/json:
              schema:
                type: object
                items:
                  success: boolean
        400:
          'description': input validation failed
          content:
            application/json:
              schema:
                type: object
                items:
                  error: if uploaded file has errors
                  errors: an array of string of errors on the input
        500:
          description: Server error
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
  /login:
    post:
      summary: logs the user in and make it known server side
      Parameters:
        header_item: x-internal
        description: header tag needed if going via frontend
        body:
          description: the data should come from the form itself
          content:
            multipart/form-data:
              schema:
                type: multipart/form-data
                items:
                  _csrf: string with csrf token
                  email: string with email
                  password: string with password
      Responses:
        200:
          description: user loggin success
          content:
            application/json:
              schema:
                type: object
                items:
                  success: boolean
        400:
          description: input validation failed
          content:
            application/json:
              schema:
                type: object
                items:
                  errors: an array of string of errors on the input
        401:
          description: user credentials do not match
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
        500:
          description: server error
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
  /logout:
    post:
      summary: logs user out and make the server forget the user
      Parameters:
        header_item: x-internal
        description: header tag needed if going via frontend
        content:
          csrfToken:
            type: string
            items:
              csrfToken: string with csrf token
      Responses:
        200:
          description: logout success
          content:
            application/json:
              schema:
                type: object
                items:
                  success: boolean
        400:
          description: no user logged in
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
  /google:
    post:
      summary: login via google account
      Parameters:
        header_item: x-internal
        description: header tag needed if going via frontend
        body:
          description: the client-id for google
          content:
            application/json:
              schema:
                type: object
                items:
                  idToken: string with google client-id
                  credentials: RequestCredentials
      Responses:
        200:
          description: user login success
          content: 
            application/json:
              schema:
                type: object
                items:
                  success: boolean
        400:
          description: input validation failed
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
        500:
          description: server error
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
  /google-check:
    post:
      summary: checks if user is logged in via google
      Parameters:
        header_item: x-internal
        description: header tag needed if going via frontend
        body:
          description: should come from the formdata
          content:
            multipart/form-data:
              schema:
                type: multipart/form-data and RequestCredentials
                items:
                  _csrf: string with csrf token
                  newUsername: string of username (optional)
                  newEmail: string of email (optional)
                  newPassword: string of password (optional)
                  newProfilePicture: file of new profilePicture (optional)
                  credentials: RequestCredentials
      Responses:
        200:
          description: user info update success
          content:
            application/json:
              schema:
                type: object
                items:
                  success: boolean
        400:
          description: google verivication failed
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
        404:
          description: user not found in database
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
        500:
          description: server error
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string witht error message
  /update:
    patch:
      summary: updates data from current user
      Parameters:
        header_item: x-internal
        description: header tag needed if going via frontend
        body:
          description: should come from the formdata
          content:
            multipart/form-data:
              schema:
                type: multipart/form-data and RequestCredentials
                items:
                  _csrf: string with csrf token
                  newUsername: string of username (optional)
                  newEmail: string of email (optional)
                  newPassword: string of password (optional)
                  newProfilePicture: file of new profile picture (optional)
                  credentials: RequestCredentials
      Responses:
        200:
          description: user info update success
          content:
            application/json:
              schema:
                type: object
                items:
                  success: boolean
        400:
          description: validation error
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string file errors
                  errors: an array with errors on input data
        404:
          description: user not found
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
        500:
          description: serve error
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
  /update-google:
    patch:
      summary: updates user data for users that made an account via google
      Parameters:
        header_item: x-internal
        description: header tag needed if going via frontend
        body:
          description:
          content:
            multipart/form-data:
              schema:
                type: multipart/form-data;
                items:
                  newUsername: string of username (optional)
                  newEmail: string of email (optional)
                  newPassword: string of password (optional)
                  newProfilePicture: file of new profile picture
      Responses:
        200:
          description: user info update success
          content:
            application/json:
              schema:
                type: object
                items: 
                  success: boolean
        400:
          description: input validation error
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
        404:
          description: user not found
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message
        500:
          description: server error
          content:
            application/json:
              schema:
                type: object
                items:
                  error: string with error message